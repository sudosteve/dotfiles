config_version = 14

[audio]
enable_overdrive = true

[bar.default]
border_width = 2.0
capsule_border = "primary"
concave_edge_corners = false
icon_color = "primary"
margin_edge = 8
margin_ends = 16
radius = 10
radius_bottom_left = 10
radius_bottom_right = 10
shadow = false
start = [ "launcher", "wallpaper", "workspaces", "widget" ]
widget_spacing = 16

[lockscreen]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "alexander/screen-toolkit" ]

[theme]
community_palette = "Tokyo Night Moon"
custom_palette = "wave-vib-2"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

[wallpaper]
directory = "/home/steve/.config/wallpapers"

    [wallpaper.default]
    path = "/home/steve/.config/wallpapers/wave.jpg"

    [wallpaper.last]
    path = "/home/steve/.config/wallpapers/wave.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/steve/.config/wallpapers/wave.jpg"

[widget.widget]
type = "alexander/screen-toolkit:widget"